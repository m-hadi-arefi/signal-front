## EMQX 5.7 — Signal Platform
## Only authentication + listener overrides live here.
## Required node fields are provided by EMQX env vars in docker-compose.

# ── Authentication ────────────────────────────────────────────────────────────
authentication = [
  {
    mechanism = password_based
    backend    = http
    enable     = true

    method = post
    url    = "http://nextjs:3000/api/mqtt/auth"

    headers {
      "content-type" = "application/json"
    }

    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }

    pool_size       = 8
    connect_timeout = 15s
    request_timeout = 10s
    max_retries     = 3
    retry_interval  = 2s
  }
]

# ── Listeners ─────────────────────────────────────────────────────────────────
listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

# ── Dashboard ─────────────────────────────────────────────────────────────────
dashboard {
  listeners.http.bind = 18083
  default_password    = "admin123"
}
