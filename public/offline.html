<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — SignalPro</title>
  <style>
    body { margin: 0; background: #08080f; color: #fff; font-family: system-ui, sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p  { color: rgba(255,255,255,0.4); font-size: 0.9rem; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.5rem; border-radius: 0.5rem;
             background: #6366f1; color: #fff; border: none; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem;margin-bottom:1rem">📡</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
