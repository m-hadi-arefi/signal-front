version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signaldb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  emqx:
    image: emqx/emqx:5.7.0
    restart: unless-stopped
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      # Required node fields (cannot be set in mounted conf without breaking boot)
      EMQX_NODE__COOKIE: "signal-emqx-cookie"
      EMQX_NODE__DATA_DIR: "/opt/emqx/data"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      # emqx.conf overrides all env-based auth config — mounted read-only
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/signaldb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}

      # EMQX server-side publisher credentials
      EMQX_API_URL: http://emqx:18083/api/v5
      EMQX_WS_URL: ws://emqx:8083/mqtt
      EMQX_MQTT_USERNAME: ${EMQX_MQTT_USERNAME:-server}
      EMQX_MQTT_PASSWORD: ${EMQX_MQTT_PASSWORD:-server-mqtt-password}

      # MQTT browser-client credentials (server-only — not NEXT_PUBLIC)
      MQTT_CLIENT_USERNAME: ${MQTT_CLIENT_USERNAME:-client}
      MQTT_CLIENT_PASSWORD: ${MQTT_CLIENT_PASSWORD:-client-mqtt-password}

      # Public broker URL for the browser (hostname only, not the password)
      NEXT_PUBLIC_EMQX_WS_URL: ${NEXT_PUBLIC_EMQX_WS_URL:-ws://localhost:8083/mqtt}

      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}

      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss && node server.js"

  signal-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/signaldb
      EMQX_WS_URL: ws://emqx:8083/mqtt
      EMQX_MQTT_USERNAME: ${EMQX_MQTT_USERNAME:-server}
      EMQX_MQTT_PASSWORD: ${EMQX_MQTT_PASSWORD:-server-mqtt-password}
      SIGNAL_API_URL: ${SIGNAL_API_URL:-http://host.docker.internal:8080}
      SIGNAL_SYNC_INTERVAL_MS: ${SIGNAL_SYNC_INTERVAL_MS:-10000}
      SIGNAL_MAX_INITIAL_PAGES: ${SIGNAL_MAX_INITIAL_PAGES:-5}
      SIGNAL_SERVICE_USER_ID: ${SIGNAL_SERVICE_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:
  minio_data:
